<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Blog Articles | Health & AI | Shabeeb Hasan</title>
  <meta name="description" content="Categorized blog articles across Health and AI with practical implementation insights and lead-generation focused strategy.">
  <link rel="canonical" href="https://shabeeb.baydot.net/blog/">
  <meta property="og:title" content="Blog Articles | Health & AI">
  <meta property="og:description" content="Explore categorized blog posts in Health and AI with actionable guidance.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shabeeb.baydot.net/blog/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/css/johndoe.css">
  <link rel="stylesheet" href="/assets/css/portfolio-refresh.css">
  <link rel="stylesheet" href="/assets/css/content-studio.css">
</head>
<body>
  <nav class="navbar sticky-top navbar-expand-lg navbar-light bg-white">
    <div class="container"><a class="navbar-brand" href="/">Shabeeb Hasan</a></div>
  </nav>
  <section class="section studio-list-page">
    <div class="container">
      <h1><span class="text-danger">Blog</span> Articles</h1>
      <p class="studio-intro">Browse categorized content in Health and AI. Built for search visibility and conversion-ready buyer intent.</p>

      <div class="listing-toolbar">
        <div id="blog-filter" class="filter-pills">
          <button class="active" data-category="all">All</button>
          <button data-category="health">Health</button>
          <button data-category="ai">AI</button>
        </div>
        <div id="blog-count" class="result-count">0 results</div>
      </div>

      <div id="blog-grid" class="studio-grid"></div>
      <div id="blog-pager" class="pager-row"></div>
    </div>
  </section>

  <script src="/js/listing.js"></script>
  <script>
    window.ListingUI.initListing({
      dataUrl: "/blog/listing.json",
      gridId: "blog-grid",
      pagerId: "blog-pager",
      countId: "blog-count",
      filterId: "blog-filter",
      ctaLabel: "Read Article",
      pageSize: 9
    });
  </script>
</body>
</html>
