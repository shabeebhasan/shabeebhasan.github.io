<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Blog Admin | Shabeeb Hasan</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/assets/css/johndoe.css">
  <link rel="stylesheet" href="/assets/css/portfolio-refresh.css">
</head>
<body>
  <section class="section">
    <div class="container" style="max-width: 900px;">
      <h1>Create Blog Post</h1>
      <p>Deploy on Vercel and set <code>BLOG_ADMIN_TOKEN</code> env var. Keep this page private.</p>
      <div id="result" class="mb-3"></div>
      <form id="blog-form">
        <div class="form-group"><label>Admin Token</label><input class="form-control" id="admin_token" type="password" required></div>
        <div class="form-group"><label>Title</label><input class="form-control" id="title" required></div>
        <div class="form-group"><label>Slug</label><input class="form-control" id="slug" required></div>
        <div class="form-group"><label>Excerpt</label><textarea class="form-control" id="excerpt" rows="2"></textarea></div>
        <div class="form-group"><label>Content (Markdown)</label><textarea class="form-control" id="content" rows="12" required></textarea></div>
        <div class="form-group"><label>Cover Image URL</label><input class="form-control" id="cover_image"></div>
        <div class="form-group"><label>Tags (comma-separated)</label><input class="form-control" id="tags"></div>
        <div class="form-group"><label>Status</label><select class="form-control" id="status"><option value="published">published</option><option value="draft">draft</option></select></div>
        <div class="form-group"><label>SEO Title</label><input class="form-control" id="seo_title"></div>
        <div class="form-group"><label>SEO Description</label><textarea class="form-control" id="seo_description" rows="2"></textarea></div>
        <button class="btn btn-primary btn-rounded" type="submit">Publish Post</button>
      </form>
    </div>
  </section>

  <script>
    const form = document.getElementById("blog-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      result.textContent = "Submitting...";

      const payload = {
        title: document.getElementById("title").value.trim(),
        slug: document.getElementById("slug").value.trim(),
        excerpt: document.getElementById("excerpt").value.trim(),
        content: document.getElementById("content").value,
        cover_image: document.getElementById("cover_image").value.trim() || null,
        tags: document.getElementById("tags").value.split(",").map(t => t.trim()).filter(Boolean),
        status: document.getElementById("status").value,
        seo_title: document.getElementById("seo_title").value.trim(),
        seo_description: document.getElementById("seo_description").value.trim()
      };

      const token = document.getElementById("admin_token").value;
      const res = await fetch("/api/blogs", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-token": token },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        result.textContent = data.error || "Failed to publish.";
        return;
      }
      result.innerHTML = `Published: <a href="/blog/post.html?slug=${encodeURIComponent(data.post.slug)}" target="_blank" rel="noopener noreferrer">${data.post.slug}</a>`;
      form.reset();
    });
  </script>
</body>
</html>
